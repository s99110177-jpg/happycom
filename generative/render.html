<!DOCTYPE html>
<html><head><meta charset="utf-8">
<script src="node_modules/p5/lib/p5.min.js"></script>
<script src="tidal_light.js"></script>
<script>
  // 영상용: 1080x1920, 자동 루프 없이 프레임을 하나씩 진행시켜 캡처한다.
  const q = new URLSearchParams(location.search);
  let params = {
    seed: parseInt(q.get("seed") || "20261120"),
    particleCount: 2600, drift: 1.0, tideScale: 0.0022, glintThreshold: 0.55, bridgeSag: 0.22, trailFade: 26,
    colorPalette: ["#2a2a6e", "#f2946f", "#ffe6b8"],
  };
  function setup() {
    pixelDensity(1);
    createCanvas(TL.W, TL.H);
    noLoop();
    initializeSystem();
    for (let i = 0; i < 40; i++) stepSystem();   // 흔적이 쌓인 상태에서 시작
    window.ready = true;
  }
  window.nextFrame = () => { stepSystem(); return document.querySelector("canvas").toDataURL("image/png"); };
</script>
<style>body{margin:0;background:#000}</style>
</head><body></body></html>
